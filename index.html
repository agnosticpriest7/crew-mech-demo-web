<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrewMechDemo 0.1.0</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%23121c20%27/%3E%3Cpath d=%27M6 24V8l10 10L26 8v16%27 fill=%27none%27 stroke=%27%2394b5a4%27 stroke-width=%274%27/%3E%3C/svg%3E"><style>
html,body{margin:0;background:#121c20;color:#d7e5df;font:18px system-ui;height:100%;overflow:hidden}main{display:grid;place-items:center;height:100%}canvas{width:min(100vw,177.77vh);height:min(56.25vw,100vh);background:#273338;outline:none}#start{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:linear-gradient(135deg,#172b2d,#1e2628)}button{font:22px system-ui;padding:20px 44px;background:#94b5a4;border:0;color:#102322;margin:25px;cursor:pointer}p{max-width:720px}#progress{position:absolute;bottom:10px;left:20px;pointer-events:none}</style></head><body><main><canvas id="game" width="1280" height="720" tabindex="0"></canvas><section id="start"><h1>CREW MECH</h1><p>Three decks inside one articulated combat machine.<br>Public solo test build. Internet co-op is pending Unity Cloud / Relay setup.</p><button id="launch">Start / controller A</button><p>Left stick moves / right stick looks / A interacts<br>RT cannon / RB sword / Menu pauses</p></section><div id="progress"></div></main><script>
let starting=false;const canvas=document.querySelector('canvas');const progress=document.querySelector('#progress');
async function start(){if(starting)return;starting=true;document.querySelector('#start').style.display='none';canvas.focus();const script=document.createElement('script');script.src='Build/WebBuild.loader.js';document.body.appendChild(script);await new Promise((yes,no)=>{script.onload=yes;script.onerror=no});try{window.unityInstance=await createUnityInstance(canvas,{dataUrl:'Build/WebBuild.data',frameworkUrl:'Build/WebBuild.framework.js',codeUrl:'Build/WebBuild.wasm',streamingAssetsUrl:'StreamingAssets',companyName:'Kyle Prototype',productName:'CrewMechDemo',productVersion:'0.1.0',matchWebGLToCanvasSize:false},p=>progress.textContent='Loading '+Math.round(p*100)+'%');progress.textContent='';}catch(e){progress.textContent='Startup failed: '+e.message;}}
document.querySelector('#launch').onclick=start;document.addEventListener('keydown',e=>{if(e.key==='Enter')start();});document.addEventListener('click',()=>{canvas.focus();if(window.unityInstance&&window.unityInstance.Module&&window.unityInstance.Module.WebAudio)window.unityInstance.Module.WebAudio.audioContext.resume();});
let was=false;function pads(){let p=window.crewPad||navigator.getGamepads()[0];if(p){let pressed=p.buttons[0]?.pressed;if(pressed&&!was&&!starting)start();was=pressed;}requestAnimationFrame(pads);}pads();
document.addEventListener('visibilitychange',()=>{if(document.hidden&&window.unityInstance)window.unityInstance.SendMessage('Crew range authority','SetPauseFromBrowser','1');});
</script></body></html>
